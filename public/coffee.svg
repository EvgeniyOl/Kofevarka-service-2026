<!-- Иконка вкладки: тот же знак, что и logo.svg, только в размере 64 px.
     Держать её отдельным файлом нужно из-за разного width/height и имён id;
     геометрию при правках синхронизируем с logo.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="64" height="64" role="img" aria-label="Kofevarka Service">
  <defs>
    <linearGradient id="faviconDisc" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#2b3140" />
      <stop offset="100%" stop-color="#191d26" />
    </linearGradient>
    <path id="faviconArcTop" d="M 22,100 A 78,78 0 0 1 178,100" fill="none" />
    <path id="faviconArcBottom" d="M 24,100 A 76,76 0 0 0 176,100" fill="none" />
  </defs>

  <circle cx="100" cy="100" r="97" fill="url(#faviconDisc)" />
  <circle cx="100" cy="100" r="95.5" fill="none" stroke="#ffffff" stroke-width="2" />
  <circle cx="100" cy="100" r="67.5" fill="none" stroke="#f6ede2" stroke-opacity="0.12" stroke-width="1" />

  <g font-family="Montserrat, Futura, 'Century Gothic', system-ui, sans-serif" font-weight="600" font-size="18" fill="#f6ede2">
    <text letter-spacing="0.2" transform="translate(0 25.7)">
      <textPath href="#faviconArcTop" startOffset="50%" text-anchor="middle">KOFEVARKA</textPath>
    </text>
    <text letter-spacing="0.4" transform="translate(0 1.9)">
      <textPath href="#faviconArcBottom" startOffset="50%" text-anchor="middle">SERVICE</textPath>
    </text>
  </g>

  <path
    d="M 21.00 90.50 L 23.46 96.62 L 30.04 97.06 L 24.98 101.29 L 26.58 107.69 L 21.00 104.18 L 15.42 107.69 L 17.02 101.29 L 11.96 97.06 L 18.54 96.62 Z"
    fill="#f6ede2"
  />
  <path
    d="M 179.00 90.50 L 181.46 96.62 L 188.04 97.06 L 182.98 101.29 L 184.58 107.69 L 179.00 104.18 L 173.42 107.69 L 175.02 101.29 L 169.96 97.06 L 176.54 96.62 Z"
    fill="#f6ede2"
  />

  <g>
    <rect x="69" y="64" width="62" height="72" rx="11" fill="#f6ede2" />
    <rect x="74" y="70" width="52" height="7" rx="3.5" fill="#232936" />
    <rect x="94" y="81" width="12" height="32" rx="6" fill="#232936" />
    <circle cx="100" cy="88" r="8" fill="#f6ede2" stroke="#232936" stroke-width="4" />
    <rect x="74" y="108" width="23" height="24" rx="7" fill="#232936" />
    <rect x="103" y="108" width="23" height="24" rx="7" fill="#232936" />
